         the icon existed got the SPA shell back and kept showing an "E" tile. -->

    <meta name="apple-mobile-web-app-title" content="Eden" />

    <!--
      `interactive-widget=resizes-content` tells iOS Safari 16.4+ and
      Chromium to shrink the layout viewport (and `dvh` units) when the
      soft keyboard opens. Combined with the workspace page being sized
      to `h-dvh`, this keeps the chat composer pinned just above the
      keyboard instead of disappearing behind it. Older iOS ignores the
      hint and falls back to its default keyboard-overlay behavior.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Geist is the UI font on every screen, so it earns a preload. Lora is
      deliberately NOT preloaded — it only renders on the sign-in header and
      opt-in canvas text styles, and `font-display: swap` covers the swap.
      WOFF2 (not TTF): same glyphs, ~55% smaller on the wire.
    -->
    <link rel="preload" href="/assets/geist.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Pre-open TCP+TLS to the origins the app talks to on boot, so the first
      real request (auth, Instant socket, thumbnails, analytics) skips the
      DNS+handshake round trips (~100-300ms each on cold loads). Prod
      hostnames are safe to hardcode: dev/localhost preconnects are no-ops.
      `crossorigin` on the API/Instant/PostHog entries because fetch() uses
      CORS connections; the image CDN is fetched no-CORS so it must NOT have it.
    -->
    <link rel="preconnect" href="https://api.eden.so" crossorigin />

    <!--
      Pre-paint theme boot. The theme system is CSS-first: every mode and
      accent is a block of CSS custom properties in style.css, selected by
      the `dark` class plus `data-mode` / `data-accent` on <html>. This
      script mirrors the logic in useThemeMode/useColorTheme so the correct
      theme applies on first paint, before React mounts — no light flash
      for dark users. Keep in sync with capture.html's boot script.
    -->

      (function () {
        try {
          var mode = window.localStorage.getItem("website.themeMode");
          var accent = window.localStorage.getItem("website.colorTheme") || "default";

          // theme on a dark canvas. Rewrite it once so the rest of the app only
          // sees light/dark/system + the mono accent.
          if (mode === "blackout") {
            mode = "dark";
            accent = "mono";
            try {
              window.localStorage.setItem("website.themeMode", "dark");
              window.localStorage.setItem("website.colorTheme", "mono");
            } catch (_e) {}

            mode =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          var root = document.documentElement;
          // Desktop pop-out windows (product-<id> / board-<id> / table-<id>, see
          // src/desktop/productWindow.ts) skip the workspace silhouette
          // below: there's no sidebar in a pop-out. The start of <body>
          // shows them.
          var windowLabel = "";
          try {
            windowLabel = window.__TAURI_INTERNALS__.metadata.currentWindow.label || "";
          } catch (_labelError) {}
          var isPopoutWindow =
            windowLabel.indexOf("product-") === 0 ||
            windowLabel.indexOf("board-") === 0 ||
            windowLabel.indexOf("table-") === 0;
          root.classList.toggle("dark", mode !== "light");
          root.dataset.mode = mode;
          root.dataset.accent = accent;
          root.style.setProperty("color-scheme", mode === "light" ? "light" : "dark");
          // Windows: main and the pop-outs have no title bar; the page draws
          // minimize / maximize / close top right (WindowsCaptionButtons.tsx,
          // 3 x 46px). Top bars step in by the inset from the first frame;
          // pages whose right-most panel changes (the product view) drop
          // below the buttons' height instead.
          if ((windowLabel === "main" || isPopoutWindow) && /Windows/.test(navigator.userAgent)) {
            root.style.setProperty("--eden-window-controls-inset", "138px");
            root.style.setProperty("--eden-window-controls-height", "32px");
          }

          // App-shell pre-paint. When a returning user loads a workspace
          // route on a desktop viewport, stamp `data-boot-shell` so the
          // static workspace silhouette in <body> (and its React twin in
          // EdenBootstrapLoadingScreen) paints instead of a blank page or
          // a logo loader. New users (no lastWorkspace record), sign-in /
          // share routes, mobile, and collapsed-sidebar users keep the
          // existing behavior. Keep the conditions and the sidebar width
          // clamp (248-480, default 260) in sync with BoardSidebar and
          // EdenBootstrapLoadingScreen.
          try {
            var path = window.location.pathname;
            var isWorkspaceRoute = path === "/" || path.indexOf("/w/") === 0;
            var hasLastWorkspace = false;
            for (var i = 0; i < window.localStorage.length; i++) {
              var storageKey = window.localStorage.key(i);
              if (storageKey && storageKey.indexOf("eden.lastWorkspace") === 0) {
                hasLastWorkspace = true;
                break;
              }
            }
            var sidebarCollapsed = window.localStorage.getItem("canvas:sidebar:collapsed") === "1";
            var isDesktopViewport = window.innerWidth >= 768;
            if (
              isWorkspaceRoute &&
              hasLastWorkspace &&
              !sidebarCollapsed &&
              isDesktopViewport &&
              !isPopoutWindow
            ) {
              var sidebarWidth = parseInt(
                window.localStorage.getItem("canvas:sidebar:width") || "",
                10,
              );
              if (!isFinite(sidebarWidth)) sidebarWidth = 260;
              sidebarWidth = Math.max(248, Math.min(480, sidebarWidth));
              root.style.setProperty("--eden-boot-sidebar-width", sidebarWidth + "px");
              root.dataset.bootShell = "1";
            }
          } catch (_shellError) {}
        } catch (_error) {}
      })();
    </script>

          button.onclick = function () {
            window.location.reload();
          };
          card.appendChild(title);
          card.appendChild(body);
          card.appendChild(button);
          wrap.appendChild(card);
          document.body.appendChild(wrap);
        } catch (_gateError) {}
      })();
    </script>
  </body>
</html>
